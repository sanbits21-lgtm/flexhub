# Weekly dependency update pull requests. Each one runs the CI workflow, so a breaking update is visible before it is merged.
# Security advisories open their own pull requests immediately, whatever this schedule says.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      backend-minor-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch: { update-types: [minor, patch] }
  # The Expo app is pinned to one tested SDK: its packages move together with `npx expo install`, never by bot. Security
  # fixes still arrive as pull requests; leave version updates off.
  - package-ecosystem: npm
    directory: /mobile
    schedule: { interval: monthly }
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /e2e
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
