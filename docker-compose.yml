# FitzyClub on ONE server: the database, the app (API + website), the HTTPS front door and daily backups.
#
#   docker compose --env-file .env.docker up -d --build        start (or update) everything
#   docker compose --env-file .env.docker ps                   what is running, and healthy
#   docker compose --env-file .env.docker logs -f app          watch the app
#   docker compose --env-file .env.docker down                 stop (the data stays; add -v only to ERASE it)
#
# All settings live in .env.docker (copy .env.docker.example). Full guide: docs/VPS.md.
# Only the front door (caddy) is reachable from the internet; the database and the app are on a private network.
name: fitzyclub

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    # Only runs when COMPOSE_PROFILES=localdb (the default in .env.docker.example). Using MongoDB Atlas instead? Leave it out
    # and set DATABASE_URL: see docs/VPS.md, "Using MongoDB Atlas instead".
    profiles: [localdb]
    # Smaller memory cache than the default (half the RAM), so the database leaves room for the app on a small server.
    command: ["mongod", "--wiredTigerCacheSizeGB", "${MONGO_CACHE_GB:-0.5}"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-} # empty makes the database refuse to start, never run open
      MONGO_INITDB_DATABASE: ${MONGO_DB:-fitzyclub}
      # Read by docker/mongo-init.sh, which creates the app's own limited user the first time.
      MONGO_DB: ${MONGO_DB:-fitzyclub}
      MONGO_APP_USER: ${MONGO_APP_USER:-fitzyclub}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-}
    volumes:
      - mongo-data:/data/db
      - ./docker/mongo-init.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --norc -u root -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Not published to the host or the internet: only the app and the backup job can reach it.
    mem_limit: ${MONGO_MEM_LIMIT:-1g}
    stop_grace_period: 30s
    logging: &logs
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  app:
    build:
      context: .
      args:
        # Optional: lets the website report its own errors to Sentry (see docs/OPERATIONS.md). Empty = off.
        SENTRY_DSN: ${SENTRY_DSN:-}
    image: fitzyclub:latest
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy, required: false } # not needed when using Atlas
    # Each setting is listed on purpose, so the app never receives the database's ROOT password or anything it does not use.
    environment:
      NODE_ENV: production
      PORT: 8080
      TRUST_PROXY: 1 # one proxy (caddy) in front: so the app sees real visitor addresses for its rate limits
      UPLOAD_DIR: /data/uploads
      # DATABASE_URL (Atlas) wins when set; otherwise the bundled database.
      MONGODB_URI: ${DATABASE_URL:-mongodb://${MONGO_APP_USER:-fitzyclub}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB:-fitzyclub}?authSource=${MONGO_DB:-fitzyclub}}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker (32+ random characters)}
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env.docker (your https:// address)}
      BASE_DOMAIN: ${BASE_DOMAIN:-}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SELF_SIGNUP: ${SELF_SIGNUP:-}
      BILLING_UPI_ID: ${BILLING_UPI_ID:-}
      BILLING_PAYEE_NAME: ${BILLING_PAYEE_NAME:-}
      MEMBER_APP_URL: ${MEMBER_APP_URL:-}
      PRIVACY_OPERATOR_NAME: ${PRIVACY_OPERATOR_NAME:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      TERMS_OPERATOR_NAME: ${TERMS_OPERATOR_NAME:-}
      TERMS_GOVERNING_LAW: ${TERMS_GOVERNING_LAW:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads:/data/uploads
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${APP_MEM_LIMIT:-768m}
    stop_grace_period: 15s
    logging: *logs
    # The image has its own health check (/health). Not published to the host: caddy is the only way in.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    # The same numbers inside and outside, so redirects to https:// point at a port that works. Normally 80 and 443.
    ports:
      - "${HTTP_PORT:-80}:${HTTP_PORT:-80}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}"
      - "${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.docker (your domain, e.g. fitzyclub.in)}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.docker (Let's Encrypt writes here about expiring certificates)}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      CADDY_LOCAL_CERTS: ${CADDY_LOCAL_CERTS:-}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # the certificates: keep this volume, or every gym address asks Let's Encrypt for a new one
      - caddy-config:/config
    mem_limit: 256m
    logging: *logs

  backup:
    image: mongo:7 # has mongodump
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy, required: false } # not needed when using Atlas
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      # DATABASE_URL (Atlas) wins when set; otherwise the bundled database.
      MONGODB_URI: ${DATABASE_URL:-mongodb://${MONGO_APP_USER:-fitzyclub}:${MONGO_APP_PASSWORD}@mongo:27017/${MONGO_DB:-fitzyclub}?authSource=${MONGO_DB:-fitzyclub}}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      TZ: ${TZ:-Asia/Kolkata}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups # a normal folder on the server, so you can copy it elsewhere
      - uploads:/data/uploads:ro
    mem_limit: 256m
    logging: *logs

volumes:
  mongo-data:
  uploads:
  caddy-data:
  caddy-config:
